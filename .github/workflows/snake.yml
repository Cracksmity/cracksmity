name: Generate snake & train

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The metro train (runs first: snk writes dist/ as root)
      - name: Generate train
        run: python3 scripts/train.py ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep the last published copies as a fallback: the output branch is rebuilt from
      # dist/ on every run, so a card that fails to regenerate would otherwise vanish.
      - name: Keep the last scene and cards as fallback
        continue-on-error: true
        run: |
          mkdir -p dist
          git fetch --depth=1 origin output
          for f in tren.svg tarjeta-stats.svg tarjeta-lenguajes.svg; do
            git show "origin/output:$f" > "dist/$f" 2>/dev/null || rm -f "dist/$f"
          done

      # The pixel-art scene and the ridership cards (github.com/Cracksmity/git-trains):
      # one train per top language, plus the stats and top-languages cards. The cards used
      # to come from github-readme-stats.vercel.app, which is paused (503 DEPLOYMENT_PAUSED).
      # Also runs before snk, and never blocks the train/snake from publishing.
      - name: Generate pixel train scene and cards
        uses: Cracksmity/git-trains@main
        continue-on-error: true
        with:
          modo: multi
          tema: dark
          idioma: en
          calendar: "true"
          salida: dist
          tarjetas: both
          rango: github
          borde: "false"
          color-fondo: "0F1115"
          color-titulo: "C9A04A"
          color-icono: "12A5A5"
          color-texto: "EEE8DC"
          color-anillo: "C9A04A"

      # Fallback: the classic snake
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C9A04A&color_dots=#161b22,#1E5BD8,#12A5A5,#E5559B,#D3311F

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
